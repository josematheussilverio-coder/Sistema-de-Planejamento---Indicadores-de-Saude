<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Farol ACS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f7fb; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 1.5rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); overflow: hidden; }
        .bg-login-image { background-color: #0d6efd; background-image: linear-gradient(135deg, #0d6efd 0%, #0284c7 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 2rem; text-align: center; }
        .form-control { padding: 0.75rem 1rem; border-radius: 0.5rem; }
        .btn-login { padding: 0.75rem; border-radius: 0.5rem; font-weight: 600; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-8 col-lg-9 col-md-10">
                <div class="card login-card row flex-row">
                    <div class="col-md-5 bg-login-image d-none d-md-flex">
                        <i class="bi bi-shield-lock text-white mb-3" style="font-size: 4rem; opacity: 0.9;"></i>
                        <h3 class="fw-bold mb-2">Farol ACS</h3>
                        <p class="small opacity-75">Acesso restrito a Agentes de Saúde autorizados. Todos os dados são sigilosos.</p>
                    </div>
                    <div class="col-md-7 p-5 bg-white">
                        <h4 class="fw-bold text-dark mb-4">Bem-vindo de volta</h4>
                        
                        {% if form.errors %}
                        <div class="alert alert-danger small rounded-3 p-2 mb-3">Usuário ou senha incorretos.</div>
                        {% endif %}

                        <form method="POST" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Usuário</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                                    <input type="text" name="username" class="form-control border-start-0" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-semibold">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-secondary"></i></span>
                                    <input type="password" name="password" class="form-control border-start-0" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-login shadow-sm">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
